; =============================================================================
; CVO API — production image overrides
;
; Loaded as conf.d/zz-prod.ini. The name matters: conf.d files load in
; alphabetical order and later files win, so this must sort AFTER the shared
; zz-cvo.ini (a name like zz-cvo-prod.ini would sort BEFORE it — '-' < '.') and
; after the image defaults (docker-php-ext-*.ini).
;
; The production image is immutable: source files never change at runtime, so
; OPcache never needs to re-stat them and checking timestamps on every request
; is pure overhead. Development instead disables OPcache entirely — see
; docker/php-dev.ini.
; =============================================================================

opcache.enable = 1
opcache.validate_timestamps = 0
