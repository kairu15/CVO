# =============================================================================
# CVO — Render Blueprint
# -----------------------------------------------------------------------------
# Two Docker web services from one repo:
#
#   cvo-backend   backend/Dockerfile   `production` target — Laravel API + MySQL
#   cvo-frontend  frontend/Dockerfile  `production` target — React/Vite SPA (nginx)
#
# WHY THE BUILD FAILED WITHOUT THIS (and why rootDir was wrong)
#   Render's build context is `dockerContext`, and it defaults to the REPOSITORY
#   ROOT. `rootDir` only scopes which file changes TRIGGER a build — it does not
#   move the context, and it does not reliably move the Dockerfile path either
#   (dockerfilePath is documented as relative to the repo root).
#   The deploy log shows exactly that mismatch: Render loaded frontend/Dockerfile
#   but handed it the repo root as context, so the bare
#       COPY package.json package-lock.json ./
#       COPY docker/nginx.conf /etc/nginx/conf.d/default.conf
#   failed with:
#       "/package.json": not found     "/docker/nginx.conf": not found
#
#   THE FIX (repo-level, so it works with Render's defaults — no dashboard
#   settings and no rootDir/dockerContext required):
#     * frontend/Dockerfile and backend/Dockerfile now COPY `frontend/...` and
#       `backend/...` prefixed paths, which resolve against the repo root;
#     * a root .dockerignore keeps the context slim (Docker only ever reads
#       .dockerignore from the context root, so the old per-service ones were
#       never read and have been folded into it);
#     * docker-compose.yml / docker-compose.prod.yml build the same way
#       (`context: .` + `dockerfile: <svc>/Dockerfile`), so a local build and a
#       Render build are byte-for-byte the same command.
#   `dockerfilePath` is set explicitly below because its default is ./Dockerfile,
#   which does not exist at the repo root. For monorepo trigger scoping use
#   `buildFilter`, not `rootDir`.
#
# SPLIT-ORIGIN (frontend and API on different hosts)
#   VITE_API_URL points the SPA at the backend's public URL, and media URLs are
#   already absolute (backend/config/filesystems.php builds them from APP_URL),
#   so images load from the API host directly. Because the two hosts are
#   cross-origin, the backend is configured with secure, same-site="none"
#   cookies plus the frontend's origin in Sanctum/CORS.
#
#   NOTE ON THE ALTERNATIVE (single-origin): the repo's nginx also supports
#   proxying /api,/sanctum,/storage to the API so everything shares one origin.
#   On Render that requires the backend to RECEIVE private-network traffic,
#   which FREE services cannot do — it needs a paid instance. Split-origin is
#   used here because it works on the free plan.
#
# DATABASE
#   Render has NO managed MySQL (only PostgreSQL), and this backend image has
#   pdo_mysql but NOT pdo_pgsql, so it cannot use Render Postgres as-is. Point
#   it at an external MySQL (Aiven, Clever Cloud, Railway, TiDB Cloud, ...) via
#   the DB_* env vars below. Alternatively deploy MySQL as its own Render
#   service with a persistent disk (a paid feature).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Laravel API
  # ---------------------------------------------------------------------------
  - type: web
    name: cvo-backend
    runtime: docker
    # Relative to the repo root, which is also the build context.
    dockerfilePath: backend/Dockerfile
    # Laravel's built-in health endpoint (backend nginx serves it via index.php).
    healthCheckPath: /up
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate with `php artisan key:generate --show`; the production
      # entrypoint refuses to boot if this is empty.
      - key: APP_KEY
        sync: false
      # The API's own public origin, e.g. https://cvo-backend.onrender.com.
      # Also the base for absolute media URLs (/secure-files), so it must be set.
      - key: APP_URL
        sync: false

      # --- External MySQL (Render has no managed MySQL) ---
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SESSION_DRIVER
        value: database
      # Render terminates TLS; cookies must be Secure.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Split-origin: the SPA is a different origin than the API.
      - key: SESSION_SAME_SITE
        value: none

      # The FRONTEND host (no scheme), e.g. cvo-frontend.onrender.com.
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      # The FRONTEND origin (with scheme), e.g. https://cvo-frontend.onrender.com.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Never seed demo accounts by default. Set to "true" for the first deploy
      # to create the demo logins, then set back to "false".
      - key: RUN_SEEDERS
        value: "false"

  # ---------------------------------------------------------------------------
  # React/Vite SPA (built with Vite, served by nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: cvo-frontend
    runtime: docker
    # Relative to the repo root, which is also the build context.
    dockerfilePath: frontend/Dockerfile
    healthCheckPath: /
    plan: free
    autoDeployTrigger: commit
    envVars:
      # Build-time: Vite inlines import.meta.env.* into the bundle during
      # `vite build`. Render passes a Docker service's env vars as build args,
      # which is how this reaches the Dockerfile's `ARG VITE_API_URL`.
      # Set to the API's public origin, e.g. https://cvo-backend.onrender.com.
      - key: VITE_API_URL
        sync: false
