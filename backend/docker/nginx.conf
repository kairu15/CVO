# =============================================================================
# CVO API — nginx server block (production image)
#
# Listens on 8080 inside the container (only reachable on the compose network,
# or proxied to by the frontend's nginx). Static assets in public/ are served
# directly; everything else falls through to index.php via FastCGI.
# =============================================================================
server {
    listen 8080;
    server_name _;

    # Laravel's document root. The app source lives one level up, so the
    # application code is never directly web-accessible.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # 10 MB upload max in php.ini, allow a little framing overhead here.
    client_max_body_size 12m;

    # Front controller for every path that is not a real file.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI to the php-fpm pool in this same container (see php-fpm.conf).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Image imports/exports can legitimately take a while.
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never expose dotfiles (except ACME challenges, if TLS is added here).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
