; =============================================================================
; CVO API — supervisord (production image)
;
; Runs nginx and php-fpm as two supervised processes in one container and
; keeps supervisord in the foreground as PID 1. nginx starts after php-fpm so
; the first proxied request cannot arrive before the pool is listening.
; =============================================================================

[supervisord]
nodaemon = true
# Running as root is intentional here: supervisord must spawn nginx (which
# binds 8080) and the php-fpm master, and php-fpm is what drops its WORKERS to
# the unprivileged `app` user (see zz-cvo.conf); artisan runs via su-exec app.
# Declaring it explicitly silences supervisord's "CRIT Supervisor is running as
# root" startup banner, which is harmless but reads like a deploy error in logs.
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
loglevel = info

[program:php-fpm]
command = php-fpm -F
autorestart = true
startsecs = 1
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autorestart = true
startsecs = 1
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
