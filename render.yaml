# =============================================================================
# CVO — Render Blueprint
# -----------------------------------------------------------------------------
# Deploys the React/Vite frontend (frontend/Dockerfile, `production` target) as
# a Docker web service.
#
# WHY THIS FILE EXISTS
#   frontend/Dockerfile is written for a build context of `frontend/` — it
#   COPYs bare `package.json` / `package-lock.json` and `docker/nginx.conf`.
#   That is exactly how the repo's own compose files build it:
#       docker-compose.yml / docker-compose.prod.yml -> context: ./frontend
#
#   Render defaults a Docker service's build context to the REPOSITORY ROOT, so
#   a service pointed at `frontend/Dockerfile` without an explicit context
#   fails at the first COPY with:
#       ERROR: "/package.json": not found
#       ERROR: "/docker/nginx.conf": not found
#
#   `dockerContext: ./frontend` below is the fix. Both paths are relative to
#   the repository root (Render's default rootDir). The equivalent dashboard
#   settings are: Root Directory = frontend, or Docker Build Context
#   Directory = ./frontend while keeping Dockerfile Path = ./frontend/Dockerfile.
#
# About the service NAME
#   Render applies a Blueprint definition to an existing service only when the
#   name matches; otherwise it creates a new service. If your failing service
#   has a different name, rename it to `cvo-frontend` (Settings → Name) before
#   syncing this Blueprint, or delete it and let the Blueprint create a fresh one.
#
# NOTE — the API is not deployed here
#   frontend/docker/nginx.conf reverse-proxies /api, /sanctum, /storage and /up
#   to `http://backend:8080`, a docker-compose service name that does not exist
#   on Render. For a working deployment you must ALSO deploy the Laravel API
#   (backend/Dockerfile, `production` target) as its own service, then either
#   point that proxy at it or set VITE_API_URL to the API's public URL for a
#   split-origin deploy (the latter requires CORS on the API side). Set
#   VITE_API_URL below before the first deploy; leaving it empty makes the SPA
#   call its own origin, which has no API behind it.
# =============================================================================

services:
  - type: web
    name: cvo-frontend
    runtime: docker

    # Both are relative to the repo root. dockerContext is the whole fix.
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

    # nginx serves the SPA at / with a 200.
    healthCheckPath: /

    # Redeploy on every push to the linked branch.
    autoDeployTrigger: commit
    # ...but only when the frontend (or this Blueprint) actually changed, so a
    # backend- or mobile-only push does not rebuild the image.
    buildFilter:
      paths:
        - frontend/**
        - render.yaml

    envVars:
      # Build-time: Vite inlines import.meta.env.* into the bundle during
      # `vite build`. Render passes a Docker service's env vars as build args,
      # which is how this reaches the Dockerfile's `ARG VITE_API_URL`.
      #
      # `sync: false` leaves the value deployment-specific (set it in the
      # Render dashboard) instead of pinning one in the repo — e.g. the public
      # URL of your deployed API. For a single-origin setup (API proxied by this
      # same nginx) it would be empty, but see the NOTE above.
      - key: VITE_API_URL
        sync: false
