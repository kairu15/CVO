; =============================================================================
; CVO API — PHP overrides
;
; Loaded as conf.d/zz-cvo.ini so it wins over the image defaults. Values are
; deliberately shared by the dev and production images; the entrypoint handles
; the parts that differ (caching, APP_ENV), and the only production tuning that
; would slow development — opcache.validate_timestamps=0 — is left off here.
; Set it to 0 in a real production deploy (the image is immutable, so the file
; stat on every request is wasted).
; =============================================================================

; Uploads: the avatar/photo caps in config/security.php are 2 MB per image, so
; PHP needs headroom for multipart framing.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000

; Do not advertise the PHP version.
expose_php = Off

; Populate $_ENV with the container environment. Laravel's `artisan serve`
; builds the child PHP process's environment from $_ENV alone; with the default
; "GPCS" that array is empty, the child loses DB_HOST/SANCTUM_* etc., and
; Dotenv falls back to a bind-mounted .env (e.g. DB_HOST=127.0.0.1) — which
; cannot reach the `db` service.
variables_order = "EGPCS"

; Emit logs to stderr so `docker compose logs` sees them.
error_log = /proc/self/fd/2

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------
opcache.enable = 1
; CLI stays uncached so `php artisan` always executes the current code.
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = disable
