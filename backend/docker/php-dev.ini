; =============================================================================
; CVO API — development image overrides
;
; Loaded as conf.d/zz-dev.ini. The name matters: conf.d files load in
; alphabetical order and later files win, so this must sort AFTER the shared
; zz-cvo.ini (a name like zz-cvo-dev.ini would sort BEFORE it — '-' < '.') and
; after the image defaults (docker-php-ext-*.ini).
;
; Development is cache-free: OPcache off means every request compiles the
; source currently on disk, so a code edit can never be shadowed by a stale
; opcode cache. Production does the opposite — see docker/php-production.ini.
; =============================================================================

opcache.enable = 0
