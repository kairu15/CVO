# =============================================================================
# CVO Frontend — nginx (production)
#
# Single-origin deployment (the recommended setup): this server serves the SPA
# *and* proxies the backend's routes, so the browser only ever talks to one
# origin. That keeps Sanctum's session/CSRF cookies first-party and removes
# CORS from the equation entirely — no SANCTUM_STATEFUL_DOMAINS / CORS origin
# mismatches to get wrong.
#
# `backend` is the compose service name; it resolves on the compose network.
# =============================================================================

# Shared proxy headers. Kept as a snippet to avoid repeating five lines per
# location.
# (Defined inline below rather than via include so the whole config is visible
#  in one place in this image.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Matches the backend/php upload ceiling.
    client_max_body_size 12m;

    # -------------------------------------------------------------------------
    # Backend routes — proxied to the Laravel container (nginx + php-fpm on 8080)
    # -------------------------------------------------------------------------

    # Laravel API (versioned under /api/v1).
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Sanctum's CSRF-cookie endpoint.
    location ^~ /sanctum/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files served by Laravel (avatars, field-visit photos).
    location ^~ /storage/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Laravel's built-in health endpoint (used by the backend healthcheck too).
    location = /up {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # SPA
    # -------------------------------------------------------------------------

    # React Router owns client-side routes (/login, /dashboard/...), so unknown
    # paths must fall back to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must not be cached, otherwise a redeploy keeps serving
    # the old bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
