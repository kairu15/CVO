; =============================================================================
; CVO API — php-fpm pool overrides (production image)
;
; Included after the image's www.conf (the `zz-` prefix sorts last), so it
; redefines the [www] pool rather than adding a second one.
; =============================================================================

[www]

; Run the pool as the non-root application user created in the Dockerfile.
user = app
group = app

; Loopback only: nginx and php-fpm share the container's network namespace, so
; the pool is never exposed outside the container.
listen = 127.0.0.1:9000

; Pass the container environment through to the workers. REQUIRED: in
; production there is no .env file, so Laravel reads DB_HOST, SANCTUM_*,
; CORS_* etc. straight from the environment — the image default would strip
; them.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker output on the container's stdout/stderr.
catch_workers_output = yes
decorate_workers_output = no
