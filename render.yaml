# =============================================================================
# CVO — Render Blueprint
# -----------------------------------------------------------------------------
# Two Docker web services from one repo:
#
#   cvo-backend   backend/Dockerfile   `production` target — Laravel API + MySQL
#   cvo-frontend  frontend/Dockerfile  `production` target — React/Vite SPA (nginx)
#
# WHY THE BUILD FAILED WITHOUT THIS (and why rootDir was wrong)
#   Render's build context is `dockerContext`, and it defaults to the REPOSITORY
#   ROOT. `rootDir` only scopes which file changes TRIGGER a build — it does not
#   move the context, and it does not reliably move the Dockerfile path either
#   (dockerfilePath is documented as relative to the repo root).
#   The deploy log shows exactly that mismatch: Render loaded frontend/Dockerfile
#   but handed it the repo root as context, so the bare
#       COPY package.json package-lock.json ./
#       COPY docker/nginx.conf /etc/nginx/conf.d/default.conf
#   failed with:
#       "/package.json": not found     "/docker/nginx.conf": not found
#
#   THE FIX (repo-level, so it works with Render's defaults — no dashboard
#   settings and no rootDir/dockerContext required):
#     * frontend/Dockerfile and backend/Dockerfile now COPY `frontend/...` and
#       `backend/...` prefixed paths, which resolve against the repo root;
#     * a root .dockerignore keeps the context slim (Docker only ever reads
#       .dockerignore from the context root, so the old per-service ones were
#       never read and have been folded into it);
#     * docker-compose.yml / docker-compose.prod.yml build the same way
#       (`context: .` + `dockerfile: <svc>/Dockerfile`), so a local build and a
#       Render build are byte-for-byte the same command.
#   `dockerfilePath` is set explicitly below because its default is ./Dockerfile,
#   which does not exist at the repo root. For monorepo trigger scoping use
#   `buildFilter`, not `rootDir`.
#
# SINGLE-ORIGIN (one public URL — the frontend service)
#   The frontend's nginx serves the SPA and reverse-proxies /api, /sanctum,
#   /storage, /secure-files and /up to the API over the API's PUBLIC URL, so
#   the browser only ever sees one origin. Sanctum's cookies are first-party
#   and CORS never applies. Free Render services cannot use private networking,
#   so the proxy crosses the public internet to reach the backend — which is
#   why the SPA is built with an EMPTY VITE_API_URL and BACKEND_UPSTREAM points
#   at the backend's onrender.com URL.
#
#   The API's own URL still answers on / with Laravel's default welcome page.
#   That is expected: it is the API, not the app. Users open the FRONTEND URL.
#
# DATABASE
#   Render has NO managed MySQL (only PostgreSQL), and this backend image has
#   pdo_mysql but NOT pdo_pgsql, so it cannot use Render Postgres as-is. Point
#   it at an external MySQL (Aiven, Clever Cloud, Railway, TiDB Cloud, ...) via
#   the DB_* env vars below. Alternatively deploy MySQL as its own Render
#   service with a persistent disk (a paid feature).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Laravel API
  # ---------------------------------------------------------------------------
  - type: web
    name: cvo-backend
    runtime: docker
    # Relative to the repo root, which is also the build context.
    dockerfilePath: backend/Dockerfile
    # Laravel's built-in health endpoint (backend nginx serves it via index.php).
    healthCheckPath: /up
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate with `php artisan key:generate --show`; the production
      # entrypoint refuses to boot if this is empty.
      - key: APP_KEY
        sync: false
      # The app's PUBLIC origin. In this single-origin setup that is the
      # FRONTEND service — the only URL a browser ever visits — e.g.
      # https://cvo-frontend.onrender.com. Laravel builds absolute URLs and
      # redirects against it, so it must be the origin users actually see
      # (not this API service's own hostname).
      - key: APP_URL
        value: https://cvo-sampletestfinal.onrender.com

      # --- External MySQL (Render has no managed MySQL) ---
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SESSION_DRIVER
        value: database
      # Render terminates TLS; cookies must be Secure.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Single-origin: the SPA and the API share the FRONTEND origin, so the
      # session cookie is same-site. Nothing here is cross-site and CORS is
      # not involved.
      - key: SESSION_SAME_SITE
        value: lax

      # The FRONTEND host (no scheme), e.g. cvo-frontend.onrender.com. Requests
      # arrive through the frontend's nginx proxy, and Sanctum's stateful check
      # keys off the Origin/Referer header the browser sends — the SPA's own
      # host — so this is the frontend, not this API service.
      - key: SANCTUM_STATEFUL_DOMAINS
        value: cvo-sampletestfinal.onrender.com
      # Unused now that every call is same-origin; kept at the SPA's origin so
      # a stray direct (cross-origin) caller is still allowed.
      - key: CORS_ALLOWED_ORIGINS
        value: https://cvo-sampletestfinal.onrender.com
      # Password-reset and account-setup links point the recipient here
      # (see AppServiceProvider / UserAccountService).
      - key: FRONTEND_URL
        value: https://cvo-sampletestfinal.onrender.com

      # Never seed demo accounts by default. Set to "true" for the first deploy
      # to create the demo logins, then set back to "false".
      - key: RUN_SEEDERS
        value: "false"

  # ---------------------------------------------------------------------------
  # React/Vite SPA (built with Vite, served by nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: cvo-frontend
    runtime: docker
    # Relative to the repo root, which is also the build context.
    dockerfilePath: frontend/Dockerfile
    healthCheckPath: /
    plan: free
    autoDeployTrigger: commit
    envVars:
      # Build-time: Vite inlines import.meta.env.* into the bundle during
      # `vite build`. Render passes a Docker service's env vars as build args,
      # which is how this reaches the Dockerfile's `ARG VITE_API_URL`.
      #
      # EMPTY is the point of this single-origin setup: the SPA then calls
      # /api, /sanctum and /secure-files on ITS OWN origin and this service's
      # nginx proxies them. An absolute URL here reverts the app to
      # split-origin and the proxy blocks go unused.
      #
      # This is a BUILD-time value, so changing it needs a REBUILD, not a
      # restart. Empty also matches the Dockerfile default (ARG VITE_API_URL="").
      - key: VITE_API_URL
        value: ""

      # The upstream for this service's nginx proxy of /api, /sanctum, /storage,
      # /secure-files and /up. Required here: the image defaults to
      # http://localhost:8080 (inert — there is no backend inside this
      # container), so without it every API call and every signed image fails.
      # Point it at the Laravel service's public origin.
      - key: BACKEND_UPSTREAM
        value: https://cvotestfinal.onrender.com
